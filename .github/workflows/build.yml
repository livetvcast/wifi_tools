name: Build WiFi Tools APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find and unpack project
        run: |
          shopt -s nullglob
          if [ -f settings.gradle.kts ]; then
            PD="."
          else
            ZIP=$(for f in *.zip; do echo "$(git log -1 --format=%ct -- "$f") $f"; done | sort -n | tail -1 | cut -d' ' -f2-)
            if [ -z "$ZIP" ]; then echo "ERROR: no .zip file found"; exit 1; fi
            mkdir -p proj
            unzip -o "$ZIP" -d proj
            PD=$(dirname "$(find proj -name settings.gradle.kts | head -n 1)")
          fi
          echo "PROJECT_DIR=$PD" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set +e
          gradle assembleDebug --no-daemon --console=plain > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            grep -E "^e: " build.log | sed -E 's#^e: file://.*/com/wifitools/app/##' | sort -u > errs.txt
            head -n 10 errs.txt | while IFS= read -r l; do echo "::error::$l"; done
            { echo '### Compile errors'; echo '```'; head -n 60 errs.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            if [ ! -s errs.txt ]; then
              grep -E "error|wrong" build.log | head -n 8 | while IFS= read -r l; do echo "::error::$l"; done
            fi
          fi
          exit $code

      - uses: actions/upload-artifact@v4
        with:
          name: wifi-tools-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
